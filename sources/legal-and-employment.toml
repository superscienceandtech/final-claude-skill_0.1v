# Law, regulation and employment obligation. Primary sources, jurisdiction-tagged.
#
# US statutes and regulations are not copyrightable — the government edicts doctrine — so the
# primary sources here are free to quote. The annotated and aggregated versions of the same law
# often are not, which is why this file points at the publisher rather than the convenient site.


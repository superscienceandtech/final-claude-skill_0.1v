id = "ecfr"
title = "Electronic Code of Federal Regulations"
publisher = "US Government Publishing Office / NARA"
url = "https://www.ecfr.gov/"
license = "public-domain-usgov"
jurisdiction = "US"
authoritative_for = "The current text of US federal regulation, updated daily. This is the citation of record — an agency web page summarizing its own rule is not."
data = "https://www.ecfr.gov/developers/documentation/api/v1"
skills = ["legal-risk:regulatory-compliance", "legal-risk:chief-legal-and-risk-officer"]
checked = "2026-09-16"

